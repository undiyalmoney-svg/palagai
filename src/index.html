<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Palagai — Trade Desk</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Palagai — OR Swing Breakout desk for Nifty, Bank Nifty &amp; more">
  <meta name="theme-color" content="#FAFBFC">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    .pg-boot {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.5rem;
      font-family: Inter, system-ui, sans-serif;
      color: #0f172a;
      background: #fafbfc;
    }
    .pg-boot-mark {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f9d58;
      color: #fff;
      font-weight: 800;
      font-size: 1.25rem;
    }
    .pg-boot strong {
      font-size: 1.15rem;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    .pg-boot span {
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <app-root>
    <div class="pg-boot" aria-busy="true">
      <div class="pg-boot-mark" aria-hidden="true">P</div>
      <strong>Palagai</strong>
      <span>Loading…</span>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>

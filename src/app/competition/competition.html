<div class="competition-wrapper">
  <div class="loading-container" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading submissions...</p>
  </div>

  <div class="empty-state" *ngIf="!loading && boards.length === 0">
    <mat-icon class="empty-icon">star_border</mat-icon>
    <p class="empty-text">No submissions yet</p>
    <p class="empty-hint">Be the first to submit your Kavithai!</p>
  </div>

  <div class="competition-boards-container" *ngIf="!loading && boards.length > 0">
    <div class="competition-board-item" *ngFor="let boardItem of boards; let i = index">
      <div class="board-rank">#{{ i + 1 }}</div>
      <div class="board-content-wrapper palagai-display-container">
        <div class="palagai-message-renderer" *ngIf="boardItem.board.message.html" [innerHTML]="boardItem.board.message.html"></div>
        <div *ngIf="!boardItem.board.message.html" class="no-message">
          <p>No message content available</p>
        </div>
      </div>
      <div class="board-actions">
        <div class="vote-info">
          <span class="vote-count-badge">{{ boardItem.voteCount }} votes</span>
        </div>
        <button
          mat-raised-button
          (click)="voteForBoard(boardItem)"
          *ngIf="!votedBoards.has(boardItem.boardKey)"
          class="vote-button can-vote"
        >
          <mat-icon>star_border</mat-icon>
          <span>Vote Now</span>
        </button>
        <a [href]="getBoardLink(boardItem.boardKey)" target="_blank" class="view-link">
          <mat-icon>open_in_new</mat-icon>
          View Board
        </a>
      </div>
    </div>
  </div>
</div>

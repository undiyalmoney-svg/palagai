<div class="kavithai-submit-container">
  <!-- Sticky Header -->
  <header class="sticky-header">
    <div class="header-content">
      <button mat-icon-button routerLink="/" class="home-btn" aria-label="Home" title="Home">
        <mat-icon>home</mat-icon>
      </button>
      <div class="header-title">
        <mat-icon class="title-icon">edit</mat-icon>
        <h1>Submit Your Kavithai</h1>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="content-wrapper">
      <form [formGroup]="kavithaiForm" (ngSubmit)="onSubmit()" class="kavithai-form">
        <!-- Content Editor -->
        <div class="editor-section">
          <div class="editor-header">
            <label class="editor-label">Your Kavithai</label>
            <div class="character-count" [class.exceeded]="characterCount > maxCharacters">
              <span class="count-text">{{ characterCount }} / {{ maxCharacters }}</span>
              <span class="count-label">Characters</span>
            </div>
          </div>
          <app-custom-editor
            formControlName="content"
            class="kavithai-editor"
            [loading]="submitting"
          ></app-custom-editor>
          
          <!-- Action Buttons -->
          <div class="action-buttons">
            <button
              mat-button
              type="button"
              (click)="openRulesDialog()"
              class="rules-btn"
            >
              <mat-icon>info</mat-icon>
              View Rules
            </button>
            <button
              mat-raised-button
              color="primary"
              type="button"
              [disabled]="submitting || submitted"
              (click)="onSubmit()"
              class="submit-btn"
            >
              <mat-spinner *ngIf="submitting" diameter="20" class="button-spinner"></mat-spinner>
              <mat-icon *ngIf="!submitting && !submitted">send</mat-icon>
              <mat-icon *ngIf="submitted">check_circle</mat-icon>
              <span>{{ submitting ? 'Submitting...' : submitted ? 'Submitted' : 'Submit' }}</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </main>
</div>

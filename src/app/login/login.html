<div class="login-wrapper">
  <mat-card class="login-card">
    <h1 class="title">Palagai</h1>
    <p class="subtitle">Sign in to your account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="input-label">Email</label>
        <mat-form-field appearance="outline" class="full-width">
          <input matInput formControlName="email" placeholder="name@company.com" />
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Enter a valid email</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <label class="input-label">Password</label>
        <mat-form-field appearance="outline" class="full-width">
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="••••••••" />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" tabindex="-1">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.invalid">Password is required</mat-error>
        </mat-form-field>
      </div>

      <div class="forgot-password-wrapper">
        <a class="forgot-link" (click)="onForgotPassword()">Forgot password?</a>
      </div>

      <button mat-flat-button class="full-width" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Please wait...' : 'Login' }}
      </button>
    </form>

    <p class="micro-line">
      New user? <a class="micro-link" routerLink="/signup">Sign up</a>
    </p>
  </mat-card>
</div>

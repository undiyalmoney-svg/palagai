<div class="settings-page">
  <header class="settings-header">
    <h1 class="settings-title">Groww API</h1>
    <span class="settings-badge" [class.active]="hasConfig" [class.inactive]="!hasConfig">
      {{ hasConfig ? 'Active' : 'Not set' }}
    </span>
  </header>

  <main class="settings-main">
    <div class="settings-card">
      <p class="settings-lead">
        Secret and Key are saved in Firebase Realtime Database under the <code>richman</code> node.
      </p>

      <div *ngIf="statusMessage" class="settings-alert" [class.success]="statusType === 'success'" [class.error]="statusType === 'error'" [class.info]="statusType === 'info'">
        {{ statusMessage }}
      </div>

      <form (ngSubmit)="save()" autocomplete="off">
        <label class="field-label" for="secret">API Secret</label>
        <textarea
          id="secret"
          name="secret"
          class="field-textarea"
          rows="4"
          [(ngModel)]="secret"
          (ngModelChange)="onFieldChange()"
          [disabled]="saving"
          placeholder="Paste API secret"
        ></textarea>

        <label class="field-label" for="key">API Key</label>
        <textarea
          id="key"
          name="key"
          class="field-textarea"
          rows="4"
          [(ngModel)]="key"
          (ngModelChange)="onFieldChange()"
          [disabled]="saving"
          placeholder="Paste API key"
        ></textarea>

        <div class="actions">
          <button type="submit" class="btn btn-primary-pill" [disabled]="saving || !(secret || '').trim() || !(key || '').trim()">
            {{ hasConfig ? 'Update' : 'Save' }}
          </button>
          <button type="button" class="btn btn-danger-pill" (click)="delete()">
            Delete
          </button>
        </div>
      </form>

      <div class="actions" style="margin-top: 0.9rem;">
        <a class="btn btn-primary-pill" routerLink="/reversal-meter" style="text-align:center; text-decoration:none;">
          Open Reversal Meter
        </a>
      </div>
    </div>
  </main>
</div>

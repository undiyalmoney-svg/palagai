<div class="reveal-container" [class.burst]="isBurst" [class.near-final]="isNearFinal">
  <!-- Animated Background -->
  <div class="animated-background"></div>

  <!-- Error State -->
  <div class="error-state" *ngIf="hasError">
    <div class="error-card">
      <mat-icon class="error-icon">error_outline</mat-icon>
      <h2>Oops!</h2>
      <p>{{ errorMessage }}</p>
      <button mat-raised-button color="primary" (click)="goHome()" class="home-btn">
        <mat-icon>home</mat-icon>
        <span>Go Home</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" *ngIf="!hasError">
    <!-- Progress Indicator -->
    <div class="progress-indicator" *ngIf="!isBurst">
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="progressPercentage"></div>
      </div>
      <span class="progress-text">{{ progressPercentageText }}</span>
    </div>

    <!-- Balloon Container -->
    <div class="balloon-wrapper" *ngIf="!isBurst">
      <div class="instruction-text">
        <p>Punch the balloon to reveal the secret 🎈</p>
      </div>

      <div class="balloon-container" 
           [style.transform]="'scale(' + balloonScale + ')'" 
           [class.shaking]="isZooming"
           (click)="handlePunch()">
        <div class="balloon" 
             [class.wobble]="currentPunchCount > 0" 
             [class.near-burst]="isNearFinal"
             [class.zooming]="isZooming"
             [class.burst-animation]="isBurst">
          <div class="balloon-body">
            <img 
              src="/assets/balloon-image.png" 
              alt="Balloon" 
              class="balloon-image"
              [class.burst]="isBurst"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Burst Animation & Card Reveal -->
    <div class="burst-container" *ngIf="isBurst">
      <div class="blast-effect"></div>

      <div class="message-reveal" [class.show]="isBurst">
        <div class="message-card">
          <div class="message-header">
            <img 
              [src]="'/assets/icon-' + selectedIcon + '.png'" 
              [alt]="'Selected Icon'"
              class="reveal-icon"
            />
            <h2>Your Secret Message</h2>
          </div>
          <div class="message-content">
            <p>{{ decodedMessage }}</p>
          </div>
          <button mat-raised-button color="primary" (click)="goHome()" class="home-btn">
            <mat-icon>home</mat-icon>
            <span>Go Home</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<mat-toolbar color="primary" class="mainboard-toolbar figma-header">
  <div class="header-content">
    <div class="header-left">
      <button mat-icon-button (click)="goBack()" class="back-btn" aria-label="Back" title="Back">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <span class="header-title">{{ isPollBoard ? 'Poll Board' : 'Board Content' }}</span>
    </div>
    <div class="header-right">
      <button 
        mat-icon-button 
        (click)="openPreview()" 
        [disabled]="loading"
        class="header-action-btn"
        aria-label="Preview"
        title="Preview"
        *ngIf="!isPollBoard"
      >
        <mat-icon>visibility</mat-icon>
      </button>
      <!-- Save Button (works for both standard and poll) -->
      <button 
        mat-icon-button 
        (click)="saveFromHeader()" 
        [disabled]="loading || saving || (boardType === 'poll' && !canModifyPoll)"
        class="header-action-btn save-btn"
        matTooltip="Save"
        [attr.aria-label]="saving ? 'Saving...' : 'Save'"
        [title]="saving ? 'Saving...' : 'Save'"
      >
        <mat-icon>{{ saving ? 'hourglass_empty' : 'save' }}</mat-icon>
      </button>
      <!-- Poll Board Delete -->
      <button 
        mat-icon-button 
        (click)="deletePoll()" 
        [disabled]="loading || saving || !hasPollData || boardType !== 'poll'"
        class="header-action-btn delete-btn"
        aria-label="Delete Poll"
        title="Delete Poll"
        *ngIf="boardType === 'poll' && hasPollData"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
</mat-toolbar>

<div class="mainboard-wrapper" [formGroup]="form">
  <!-- Blocked Status Banner -->
  <div class="blocked-banner" *ngIf="board?.isBlocked">
    <mat-icon>block</mat-icon>
    <div class="blocked-message">
      <strong>Your board has been blocked</strong>
      <p>Please contact the ADMIN for retrieving your account.</p>
    </div>
  </div>

  <!-- Editor Card -->
  <div class="editor-card" [class.blocked]="board?.isBlocked" [class.standard-board]="boardType === 'standard'">
    <!-- Standard Board Editor -->
    <app-custom-editor
      *ngIf="boardType === 'standard'"
      formControlName="content"
      class="figma-editor"
      [loading]="loading"
    ></app-custom-editor>

    <!-- Poll Board Editor -->
    <app-poll-editor
      *ngIf="boardType === 'poll'"
      #pollEditor
      [pollData]="pollData"
      [canModify]="canModifyPoll"
      [isPrimaryBoard]="isPrimaryBoardControl.value"
      (pollSave)="savePoll($event)"
      (pollClear)="clearPoll()"
      (primaryBoardChange)="onPrimaryBoardChangeFromPoll($event)"
    ></app-poll-editor>

  </div>

  <!-- Board Options (Sticky at bottom) - Only for standard boards -->
  <div class="primary-board-section" *ngIf="boardType === 'standard'">
    <div class="board-option-item">
      <mat-checkbox formControlName="isPrimaryBoard" class="primary-board-checkbox" (change)="onPrimaryBoardChange($event)">
        <span class="checkbox-label">Primary Board</span>
      </mat-checkbox>
    </div>
    
    <p class="board-options-hint">
      <a href="javascript:void(0)" (click)="openPrimaryBoardInfo()" class="hint-link">Click to learn more</a>
    </p>
  </div>

</div>

<!-- Floating Action Button Menu -->
<div class="fab-menu-container" [class.menu-open]="fabMenuOpen">
  <!-- Board Type Navigation -->
  <div class="fab-menu">
    <div class="fab-menu-item" (click)="handleBoardTypeChange('poll'); fabMenuOpen = false" [class.disabled]="loading || saving || boardType === 'poll'">
      <span class="fab-label">Poll Board</span>
      <button mat-fab class="fab-circle-btn" [disabled]="loading || saving || boardType === 'poll'">
        <mat-icon>poll</mat-icon>
      </button>
    </div>
    <div class="fab-menu-item" (click)="handleBoardTypeChange('standard'); fabMenuOpen = false" [class.disabled]="loading || saving || boardType === 'standard'">
      <span class="fab-label">Standard Board</span>
      <button mat-fab class="fab-circle-btn" [disabled]="loading || saving || boardType === 'standard'">
        <mat-icon>description</mat-icon>
      </button>
    </div>
  </div>

  <!-- Close Button -->
  <button mat-fab class="fab-close-btn" (click)="toggleFabMenu()">
    <mat-icon>{{ fabMenuOpen ? 'close' : 'add' }}</mat-icon>
  </button>
</div>

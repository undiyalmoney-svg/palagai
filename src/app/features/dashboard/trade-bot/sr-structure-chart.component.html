<div class="sr-chart" data-testid="sr-structure-chart">
  <div class="sr-chart-head">
    <div>
      <strong>{{ title || 'S/R box' }}</strong>
      @if (subtitle) {
        <span>{{ subtitle }}</span>
      }
    </div>
    <ul class="sr-legend">
      <li class="wall">Wall</li>
      <li class="pink">Against</li>
      <li class="teal">With</li>
    </ul>
  </div>
  <canvas #canvas role="img" [attr.aria-label]="title || 'Index 5m S/R structure'"></canvas>
</div>

<div class="sr-chart" data-testid="sr-structure-chart">
  <div class="sr-chart-head">
    <div>
      <strong>{{ title || 'S/R 5m' }}</strong>
      @if (subtitle) {
        <span>{{ subtitle }}</span>
      }
    </div>
    <ul class="sr-legend">
      <li class="res">Resistance</li>
      <li class="sup">Support</li>
      <li class="bo">Breakout</li>
      <li class="cf">Confirm</li>
      <li class="in">Entered</li>
    </ul>
  </div>
  <canvas #canvas role="img" [attr.aria-label]="title || 'Index 5m S/R breakout confirm'"></canvas>
</div>

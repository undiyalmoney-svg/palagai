<section class="trend-page" data-testid="chart-trends">
  @if (sessionExpired()) {
    <p class="trend-banner" role="alert">
      Kite token expired.
      <a routerLink="/dashboard/get-token">Get Token</a>
    </p>
  }

  <div class="trend-grid">
    @for (pane of panes(); track pane.def.id) {
      <article class="trend-card" [attr.data-lamp]="lamp(pane)" [attr.data-testid]="'trend-' + pane.def.id">
        <h2>{{ pane.def.label }}</h2>
        <p class="trend-word">{{ lampLabel(pane) }}</p>
        @if (pane.error && !sessionExpired()) {
          <p class="trend-error">{{ pane.error }}</p>
        }
      </article>
    }
  </div>
</section>

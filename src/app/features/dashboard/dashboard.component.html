<div class="palagai-shell">
  <header class="palagai-header">
    <div class="palagai-header-inner">
      <a class="brand" href="/dashboard/trade-desk" (click)="go('/dashboard/trade-desk', $event)">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span class="brand-text">
          <strong>Palagai</strong>
          <small>Trade with clarity</small>
        </span>
      </a>
      <span
        class="build-badge"
        [attr.title]="'App build ' + appBuildLabel + ' — if this is missing/old after pull, hard-refresh (Cmd+Shift+R)'"
      >
        {{ appBuildLabel }}
      </span>

      <nav class="palagai-nav" aria-label="Main">
        @for (item of navItems; track item.route) {
          <a
            [href]="item.route"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="go(item.route, $event)"
          >
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>

      <button mat-stroked-button type="button" class="logout-btn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>
  </header>

  <main class="palagai-main">
    <router-outlet />
  </main>

  <nav class="mobile-tabbar" aria-label="Mobile menu">
    @for (item of navItems; track item.route) {
      <a
        class="tab-item"
        [href]="item.route"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="go(item.route, $event)"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span class="tab-label">{{ item.shortLabel }}</span>
      </a>
    }
  </nav>

  <footer class="palagai-footer">
    <span class="bull-dot" aria-hidden="true"></span>
    <span>Bull · Bear · Same rules every session · {{ appBuildLabel }}</span>
    <span class="bear-dot" aria-hidden="true"></span>
  </footer>
</div>

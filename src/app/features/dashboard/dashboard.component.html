<div class="palagai-shell">
  <header class="palagai-header">
    <div class="palagai-header-inner">
      <a class="brand" routerLink="/dashboard/trade-desk">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span class="brand-text">
          <strong>Palagai</strong>
          <small>Trade with clarity</small>
        </span>
      </a>

      <nav class="palagai-nav" aria-label="Main">
        @for (item of navItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>

      <button mat-stroked-button type="button" class="logout-btn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>
  </header>

  <main class="palagai-main">
    <router-outlet />
  </main>

  <nav class="mobile-tabbar" aria-label="Mobile menu">
    @for (item of navItems; track item.route) {
      <a
        class="tab-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span class="tab-label">{{ item.shortLabel }}</span>
      </a>
    }
  </nav>

  <footer class="palagai-footer">
    <span class="bull-dot" aria-hidden="true"></span>
    <span>Bull · Bear · Same rules every session</span>
    <span class="bear-dot" aria-hidden="true"></span>
  </footer>
</div>

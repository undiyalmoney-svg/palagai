<section class="experiments pg-page">
  <header class="expt-hero">
    <div class="expt-copy">
      <p class="pg-eyebrow">Paper lab · future DNAs</p>
      <h1>Experiments</h1>
      <p class="pg-lede">
        Plan and paper-test new ideas before they hit Trade Desk.
        <strong>Crude Oil Mini</strong>, <strong>Natural Gas Mini</strong>, and
        <strong>Top 50 stocks</strong> — hunt DNAs that print money.
      </p>
    </div>
  </header>

  <div class="expt-tabs" role="tablist" aria-label="Experiment books">
    <button
      type="button"
      role="tab"
      class="expt-tab"
      [class.active]="tab() === 'crude'"
      [attr.aria-selected]="tab() === 'crude'"
      (click)="setTab('crude')"
    >
      <span class="expt-tab-title">Crude Oil Mini</span>
      <span class="expt-tab-sub">MCX · paper OR / All-Green</span>
    </button>
    <button
      type="button"
      role="tab"
      class="expt-tab"
      [class.active]="tab() === 'natgas'"
      [attr.aria-selected]="tab() === 'natgas'"
      (click)="setTab('natgas')"
    >
      <span class="expt-tab-title">Natural Gas Mini</span>
      <span class="expt-tab-sub">MCX · paper DNA lab</span>
    </button>
    <button
      type="button"
      role="tab"
      class="expt-tab"
      [class.active]="tab() === 'stocks'"
      [attr.aria-selected]="tab() === 'stocks'"
      (click)="setTab('stocks')"
    >
      <span class="expt-tab-title">Stocks Top 50</span>
      <span class="expt-tab-sub">NSE · equity paper book</span>
    </button>
  </div>

  <!-- Keep desks mounted so paper/live runs survive tab switches -->
  <div class="expt-panel" [class.off]="tab() !== 'crude'" role="tabpanel">
    <app-crude-oil-desk miniAsset="crude" [embedded]="true" />
  </div>
  <div class="expt-panel" [class.off]="tab() !== 'natgas'" role="tabpanel">
    <app-crude-oil-desk miniAsset="natgas" [embedded]="true" />
  </div>
  <div class="expt-panel" [class.off]="tab() !== 'stocks'" role="tabpanel">
    <app-stocks-desk [embedded]="true" [experimentsMode]="true" />
  </div>
</section>
